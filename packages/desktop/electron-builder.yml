appId: com.tgolmsk.avdm
productName: AVD 多开管理器
asar: true
# Sharp loads native .node binaries and libvips beside its package at runtime.
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
directories:
  output: ../../release
files:
  - out/**/*
  - package.json
  - '!**/*.map'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: AVDM-${version}-mac-arm64.${ext}
dmg:
  title: AVD 多开管理器 ${version}
