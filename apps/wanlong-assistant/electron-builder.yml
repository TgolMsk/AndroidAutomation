appId: com.tgolmsk.wanlongassistant
productName: 万龙助手
asar: true
# Sharp needs its native addon and libvips next to its package at runtime.
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
directories:
  output: ../../release/wanlong-assistant
files:
  - out/**/*
  - package.json
  - '!**/*.map'
# The built-in template library ships with the app (original: resources/templates → user library at first start,
# only-add). The main process finds it at <Resources>/templates (src/main/automation/builtin-templates.ts).
extraResources:
  - from: resources/templates
    to: templates
    filter:
      - '**/*'
mac:
  category: public.app-category.productivity
  icon: build/app-icon.icns
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: Wanlong-Assistant-${version}-mac-arm64.${ext}
dmg:
  title: 万龙助手 ${version}
