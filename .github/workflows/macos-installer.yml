name: macOS installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Clear output from earlier runs
        run: rm -rf release
      - run: pnpm dist:mac:all
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify both installers
        run: |
          emulator_version=$(node -p "require('./packages/desktop/package.json').version")
          assistant_version=$(node -p "require('./apps/wanlong-assistant/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            test "$emulator_version" = "${GITHUB_REF_NAME#v}"
            test "$assistant_version" = "${GITHUB_REF_NAME#v}"
          fi
          emulator_dmg="release/AVDM-${emulator_version}-mac-arm64.dmg"
          assistant_dmg="release/wanlong-assistant/Wanlong-Assistant-${assistant_version}-mac-arm64.dmg"
          test -f "$emulator_dmg"
          test -f "$assistant_dmg"
          test "$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          test "$(find release/wanlong-assistant -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          emulator_app='release/mac-arm64/AVD 多开管理器.app'
          assistant_app='release/wanlong-assistant/mac-arm64/万龙助手.app'
          for app in "$emulator_app" "$assistant_app"; do
            test -f "$app/Contents/Resources/app.asar"
            codesign --verify --deep --strict "$app"
          done
          test -x "$emulator_app/Contents/Resources/bin/avdm"
          test -f "$assistant_app/Contents/Resources/app.asar.unpacked/node_modules/@img/sharp-darwin-arm64/lib/sharp-darwin-arm64-0.35.4.node"
          test -f "$assistant_app/Contents/Resources/app.asar.unpacked/node_modules/@img/sharp-libvips-darwin-arm64/lib/libvips-cpp.8.18.6.dylib"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$emulator_app/Contents/Info.plist")" = 'com.tgolmsk.avdm'
          test "$(plutil -extract CFBundleIdentifier raw -o - "$assistant_app/Contents/Info.plist")" = 'com.tgolmsk.wanlongassistant'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$emulator_app/Contents/Info.plist")" = "$emulator_version"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$assistant_app/Contents/Info.plist")" = "$assistant_version"
          hdiutil verify "$emulator_dmg"
          hdiutil verify "$assistant_dmg"
          (cd release && shasum -a 256 *.dmg wanlong-assistant/*.dmg > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
          # The assistant's in-app updater downloads this asset and looks its digest up in SHA256SUMS by base name.
          grep -Fq "  wanlong-assistant/Wanlong-Assistant-${assistant_version}-mac-arm64.dmg" release/SHA256SUMS
      - name: Smoke test both packaged apps
        run: node scripts/smoke-packaged.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: avdm-and-wanlong-macos-arm64
          path: |
            release/*.dmg
            release/wanlong-assistant/*.dmg
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish tagged preview
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg release/wanlong-assistant/*.dmg release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg release/wanlong-assistant/*.dmg release/SHA256SUMS --notes-file docs/RELEASE.md --prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}
